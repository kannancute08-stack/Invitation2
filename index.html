<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinner Invitation | Flag Staff House</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --parchment: #fdfaf0;
            --ink: #1a1a1a;
            --gold: #b8860b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        /* --- Buddha Background Image with 90% Transparency --- */
        .buddha-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 90% transparency means 0.1 opacity */
            opacity: 0.1; 
            z-index: -1;
            /* Using the local file path provided */
            background-image: url('https://raw.githubusercontent.com/kannancute08-stack/Invitation2/main/bg.png');
            background-size: cover;
            background-position: center;
        }

        .scroll-container {
            position: relative;
            width: clamp(320px, 90vw, 750px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Roller Styling */
        .roller {
            width: 105%;
            height: 35px;
            background: linear-gradient(to bottom, #2a1810, #5d3a28, #2a1810);
            border-radius: 5px;
            z-index: 10;
            border: 1px solid #1a0f0a;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .roller-bottom {
            position: absolute;
            top: 0;
            animation: rollDown 2.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
        }

        /* Parchment Styling */
        .parchment {
            background-color: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            width: 100%;
            height: 0;
            opacity: 20;
            overflow: hidden;
            box-shadow: inset 0 0 100px rgba(139, 69, 19, 0.15), 0 10px 30px rgba(0,0,0,0.5);
            animation: expandPaper 2.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
            text-align: center;
            color: var(--ink);
        }

        /* Animation Keyframes */
        @keyframes rollDown {
            0% { top: 0; transform: rotate(0deg); }
            100% { top: 100%; transform: rotate(720deg) translateY(-18px); }
        }

        @keyframes expandPaper {
            0% { height: 0; opacity: 0; }
            10% { opacity: 1; }
            100% { height: 650px; opacity: 1; }
        }

        /* Content Styling */
        .content {
            padding: 60px 40px;
            opacity: 0;
            animation: fadeInText 1s ease-in 2.2s forwards;
        }

        @keyframes fadeInText {
            to { opacity: 1; }
        }

        .intro {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .name {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 700;
            color: #000;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--gold);
            display: inline-block;
            padding-bottom: 10px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            text-align: left;
        }

        .details-grid div {
            display: flex;
            align-items: baseline;
        }

        .label {
            font-style: italic;
            font-size: 1rem;
            color: #666;
            width: 40px;
            flex-shrink: 0;
        }

        .val { font-weight: 700; }

        .footer-info {
            text-align: left;
            margin-top: 40px;
            font-size: 1rem;
            line-height: 1.8;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .footer-info b { font-family: 'Montserrat', sans-serif; font-weight: 600; }

        @media (max-width: 480px) {
            .details-grid { grid-template-columns: 1fr; }
            .content { padding: 40px 20px; }
            @keyframes expandPaper {
                100% { height: 85vh; opacity: 1; }
            }
            @keyframes rollDown {
                100% { top: 100%; transform: rotate(720deg) translateY(-20px); }
            }
        }
    </style>
</head>
<body>

    <div class="buddha-bg"></div>

    <div class="scroll-container">
        <div class="roller roller-top"></div>
        
        <div class="parchment">
            <div class="content">
                <p class="intro">request the pleasure of the company of</p>
                <h1 class="name">Mr Aniket Govind Mandavgane</h1>

                <div class="details-grid">
                    <div><span class="label">to</span> <span class="val">Dinner</span></div>
                    <div><span class="label">at</span> <span class="val">Flag Staff House</span></div>
                    <div><span class="label">on</span> <span class="val">12 Mar 2026</span></div>
                    <div><span class="label">at</span> <span class="val">6.45 P.M.</span></div>
                </div>

                <div class="footer-info">
                    <p><b>RSVP :</b> ADC to Commandant (Regrets only)</p>
                    <p><b>Dress :</b> Formals</p>
                    <p><b>Mob :</b> +91-8874915524</p>
                </div>
            </div>
        </div>

        <div class="roller roller-bottom"></div>
    </div>

</body>
</html>
